<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oppgaver – Graabein Skjegg</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --bg: #1B1815;
  --surface: #241F19;
  --surface-2: #302A21;
  --line: #453B2C;
  --text: #F0EAE0;
  --text-muted: #A99C87;
  --accent: #C17A3D;
  --danger: #B5533C;
  --soon: #C6A15B;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  min-height: 100%;
}
#app {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; margin: 0; }

.loading { color: var(--text-muted); padding: 40px 0; text-align: center; }

.header { margin-bottom: 20px; }
.header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.sub { margin: 2px 0 0; color: var(--text-muted); font-size: 13px; }

.roster {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.chip-wrap { position: relative; display: flex; align-items: stretch; }
.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--chip-color, var(--line));
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}
.chip.is-active { background: var(--surface-2); border-color: var(--chip-color); }
.chip-count {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg);
  border-radius: 10px;
  padding: 1px 6px;
  min-width: 16px;
  text-align: center;
}
.chip-remove {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 16px;
  width: 20px;
  cursor: pointer;
  line-height: 1;
}
.chip-remove:hover { color: var(--danger); }
.chip-new { border-style: dashed; color: var(--text-muted); }
.add-employee { display: flex; gap: 6px; }
.add-employee input {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 10px;
  font-size: 14px;
  width: 120px;
  font-family: inherit;
}
.add-employee button {
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #1B1815;
  font-weight: 600;
  padding: 0 12px;
  font-size: 13px;
  cursor: pointer;
}

.confirm-pop {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 5;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  white-space: nowrap;
  box-shadow: 0 6px 16px rgba(0,0,0,0.35);
}
.confirm-pop.for-task { right: 0; left: auto; }
.confirm-pop button {
  border: none;
  background: var(--danger);
  color: #fff;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 12px;
  cursor: pointer;
}
.confirm-pop button.ghost {
  background: none;
  color: var(--text-muted);
  border: 1px solid var(--line);
}

.list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.list-head h2 { font-size: 19px; font-weight: 600; }
.btn-primary {
  background: var(--accent);
  color: #1B1815;
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}

.empty {
  color: var(--text-muted);
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 24px 16px;
  text-align: center;
  font-size: 14px;
}

.tasks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.task {
  display: flex;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--task-color, var(--line));
  border-radius: 10px;
  padding: 14px;
  position: relative;
  align-items: flex-start;
}
.task.is-done { opacity: 0.55; }
.task.is-done .task-title { text-decoration: line-through; }

.check {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
  padding: 0;
}

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 15px; font-weight: 600; }
.task-desc { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
.task-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.tag {
  font-size: 11.5px;
  background: var(--surface-2);
  border: 1px solid var(--tag-color);
  color: var(--text);
  padding: 2px 8px;
  border-radius: 6px;
}
.deadline { font-size: 11.5px; color: var(--text-muted); padding: 2px 0; }
.deadline.is-soon { color: var(--soon); }
.deadline.is-overdue { color: var(--danger); font-weight: 600; }

.task-delete {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  line-height: 1;
  padding: 0 2px;
}
.task-delete:hover { color: var(--danger); }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 20;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  padding: 20px;
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-height: 85vh;
  overflow-y: auto;
}
.modal h3 { font-size: 19px; margin-bottom: 4px; }
.modal label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: var(--text-muted);
}
.modal input, .modal textarea, .modal select {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  padding: 10px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
}
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.modal-actions .ghost {
  background: none;
  border: 1px solid var(--line);
  color: var(--text-muted);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
}

.save-error {
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  max-width: 480px;
  margin: 0 auto;
  background: var(--danger);
  color: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  text-align: center;
  z-index: 30;
}
</style>
</head>
<body>
<div id="app"><div class="loading">Henter oppgaver …</div></div>

<script>
// ---- Oppsett ----
const FIREBASE_PROJECT_ID = "graabein-oppgaver";
const DOC_COLLECTION = "graabein-oppgaver";
const DOC_ID = "data";
const REST_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/${DOC_COLLECTION}/${DOC_ID}`;
const POLL_INTERVAL_MS = 4000;

const EMPLOYEE_COLORS = ["#C17A3D", "#5E7A8C", "#7C8478", "#9C5F5F", "#8A6E4B", "#6E7B5E"];

// ---- Tilstand ----
let state = {
  loaded: false,
  employees: [],
  tasks: [],
  selected: "all",
  addingEmployee: false,
  confirmRemoveId: null,
  confirmDeleteTaskId: null,
  showForm: false,
  form: { title: "", description: "", deadline: "", assignee: "" },
  saveError: "",
};
let saving = false;

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

// ---- Hjelpefunksjoner ----
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("nb-NO", { day: "numeric", month: "short", year: "numeric" });
}
function daysUntil(iso) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(iso + "T00:00:00");
  return Math.round((d - today) / 86400000);
}
function colorFor(id) {
  const idx = state.employees.findIndex((e) => e.id === id);
  if (idx === -1) return "#5A5245";
  return EMPLOYEE_COLORS[idx % EMPLOYEE_COLORS.length];
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

// ---- Firestore REST <-> JS ----
function toFirestoreValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === "string") return { stringValue: v };
  if (typeof v === "boolean") return { booleanValue: v };
  if (typeof v === "number") return { doubleValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFirestoreValue) } };
  if (typeof v === "object") return { mapValue: { fields: toFirestoreFields(v) } };
  return { stringValue: String(v) };
}
function toFirestoreFields(obj) {
  const fields = {};
  for (const key in obj) fields[key] = toFirestoreValue(obj[key]);
  return fields;
}
function fromFirestoreValue(fv) {
  if (!fv) return null;
  if ("stringValue" in fv) return fv.stringValue;
  if ("booleanValue" in fv) return fv.booleanValue;
  if ("doubleValue" in fv) return fv.doubleValue;
  if ("integerValue" in fv) return Number(fv.integerValue);
  if ("nullValue" in fv) return null;
  if ("arrayValue" in fv) return (fv.arrayValue.values || []).map(fromFirestoreValue);
  if ("mapValue" in fv) return fromFirestoreFields(fv.mapValue.fields || {});
  return null;
}
function fromFirestoreFields(fields) {
  const obj = {};
  for (const key in fields || {}) obj[key] = fromFirestoreValue(fields[key]);
  return obj;
}

async function fetchFromServer() {
  const res = await fetch(REST_URL);
  if (res.status === 404) return { employees: [], tasks: [] };
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  return fromFirestoreFields(json.fields);
}

async function load() {
  if (saving) return;
  try {
    const data = await fetchFromServer();
    state.employees = data.employees || [];
    state.tasks = data.tasks || [];
    state.saveError = "";
  } catch (e) {
    state.saveError = "Kunne ikke koble til Firebase: " + (e && e.message ? e.message : String(e));
  }
  state.loaded = true;
  // Ikke tegn om midt i at noen skriver i et åpent skjema - det ville nullstilt feltet
  if (state.addingEmployee || state.showForm) return;
  render();
}

async function persist(nextEmployees, nextTasks) {
  saving = true;
  try {
    const res = await fetch(REST_URL, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: toFirestoreFields({ employees: nextEmployees, tasks: nextTasks }) }),
    });
    if (!res.ok) {
      const body = await res.text();
      throw new Error("HTTP " + res.status + ": " + body);
    }
    state.saveError = "";
  } catch (e) {
    state.saveError = "Lagring feilet: " + (e && e.message ? e.message : String(e));
  }
  saving = false;
  render();
}

// ---- Handlinger ----
function addEmployee() {
  const input = document.getElementById("new-employee-name");
  const name = input ? input.value.trim() : "";
  if (!name) return;
  const next = [...state.employees, { id: uid(), name }];
  state.employees = next;
  state.addingEmployee = false;
  render();
  persist(next, state.tasks);
}

function removeEmployee(id) {
  const nextEmployees = state.employees.filter((e) => e.id !== id);
  const nextTasks = state.tasks.map((t) => (t.assignee === id ? { ...t, assignee: "" } : t));
  state.employees = nextEmployees;
  state.tasks = nextTasks;
  state.confirmRemoveId = null;
  if (state.selected === id) state.selected = "all";
  render();
  persist(nextEmployees, nextTasks);
}

function submitTask() {
  const title = document.getElementById("task-title").value.trim();
  if (!title) return;
  const description = document.getElementById("task-desc").value.trim();
  const deadline = document.getElementById("task-deadline").value;
  const assignee = document.getElementById("task-assignee").value;
  const task = { id: uid(), title, description, deadline, assignee, done: false, createdAt: new Date().toISOString() };
  const next = [task, ...state.tasks];
  state.tasks = next;
  state.showForm = false;
  render();
  persist(state.employees, next);
}

function toggleDone(id) {
  const next = state.tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
  state.tasks = next;
  render();
  persist(state.employees, next);
}

function deleteTask(id) {
  const next = state.tasks.filter((t) => t.id !== id);
  state.tasks = next;
  state.confirmDeleteTaskId = null;
  render();
  persist(state.employees, next);
}

function openCountFor(id) {
  return state.tasks.filter((t) => t.assignee === id && !t.done).length;
}

function visibleTasks() {
  let list = state.selected === "all" ? state.tasks : state.tasks.filter((t) => t.assignee === state.selected);
  return [...list].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!a.deadline) return 1;
    if (!b.deadline) return -1;
    return a.deadline.localeCompare(b.deadline);
  });
}

// ---- Rendering ----
function render() {
  const app = document.getElementById("app");

  if (!state.loaded) {
    app.innerHTML = `<div class="loading">Henter oppgaver …</div>`;
    return;
  }

  const selectedEmployee = state.employees.find((e) => e.id === state.selected);
  const openTotal = state.tasks.filter((t) => !t.done).length;

  let rosterHtml = `
    <button class="chip ${state.selected === "all" ? "is-active" : ""}" style="--chip-color:#8A8071" data-action="select" data-id="all">
      Alle <span class="chip-count">${openTotal}</span>
    </button>
  `;

  state.employees.forEach((emp) => {
    const active = state.selected === emp.id ? "is-active" : "";
    const color = colorFor(emp.id);
    rosterHtml += `
      <div class="chip-wrap">
        <button class="chip ${active}" style="--chip-color:${color}" data-action="select" data-id="${emp.id}">
          ${esc(emp.name)} <span class="chip-count">${openCountFor(emp.id)}</span>
        </button>
        ${
          state.confirmRemoveId === emp.id
            ? `<div class="confirm-pop">
                 <span>Fjerne ${esc(emp.name)}?</span>
                 <button data-action="confirm-remove" data-id="${emp.id}">Ja, fjern</button>
                 <button class="ghost" data-action="cancel-remove">Avbryt</button>
               </div>`
            : `<button class="chip-remove" data-action="ask-remove" data-id="${emp.id}" aria-label="Fjern ${esc(emp.name)}">×</button>`
        }
      </div>
    `;
  });

  rosterHtml += state.addingEmployee
    ? `<div class="add-employee">
         <input id="new-employee-name" placeholder="Navn" autofocus />
         <button data-action="add-employee">Legg til</button>
       </div>`
    : `<button class="chip chip-new" data-action="start-add-employee">+ Ansatt</button>`;

  const list = visibleTasks();
  let tasksHtml = "";
  if (list.length === 0) {
    tasksHtml = `<div class="empty">${
      state.employees.length === 0
        ? "Ingen ansatte lagt til enda. Trykk «+ Ansatt» for å komme i gang."
        : "Ingen oppgaver her enda. Trykk «Ny oppgave» for å legge ut en."
    }</div>`;
  } else {
    tasksHtml = `<ul class="tasks">` + list.map((t) => {
      const assignedEmp = state.employees.find((e) => e.id === t.assignee);
      const overdue = t.deadline && !t.done && daysUntil(t.deadline) < 0;
      const dueSoon = t.deadline && !t.done && daysUntil(t.deadline) >= 0 && daysUntil(t.deadline) <= 2;
      return `
        <li class="task ${t.done ? "is-done" : ""}" style="--task-color:${colorFor(t.assignee)}">
          <button class="check" data-action="toggle-done" data-id="${t.id}" aria-label="${t.done ? "Merk som ikke ferdig" : "Merk som ferdig"}">${t.done ? "✓" : ""}</button>
          <div class="task-body">
            <div class="task-title">${esc(t.title)}</div>
            ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ""}
            <div class="task-meta">
              ${state.selected === "all" ? `<span class="tag" style="--tag-color:${colorFor(t.assignee)}">${assignedEmp ? esc(assignedEmp.name) : "Ikke tildelt"}</span>` : ""}
              ${t.deadline ? `<span class="deadline ${overdue ? "is-overdue" : dueSoon ? "is-soon" : ""}">${overdue ? "Forfalt " : "Frist "}${fmtDate(t.deadline)}</span>` : ""}
            </div>
          </div>
          ${
            state.confirmDeleteTaskId === t.id
              ? `<div class="confirm-pop for-task">
                   <button data-action="confirm-delete-task" data-id="${t.id}">Slett</button>
                   <button class="ghost" data-action="cancel-delete-task">Avbryt</button>
                 </div>`
              : `<button class="task-delete" data-action="ask-delete-task" data-id="${t.id}" aria-label="Slett oppgave">×</button>`
          }
        </li>
      `;
    }).join("") + `</ul>`;
  }

  app.innerHTML = `
    <header class="header">
      <h1>Oppgaver</h1>
      <p class="sub">Graabein Skjegg</p>
    </header>

    <nav class="roster" aria-label="Velg ansatt">${rosterHtml}</nav>

    <main>
      <div class="list-head">
        <h2>${state.selected === "all" ? "Alle oppgaver" : selectedEmployee ? esc(selectedEmployee.name) + " sine oppgaver" : "Oppgaver"}</h2>
        <button class="btn-primary" data-action="open-form">Ny oppgave</button>
      </div>
      ${tasksHtml}
    </main>

    ${
      state.showForm
        ? `<div class="modal-backdrop">
             <div class="modal">
               <h3>Ny oppgave</h3>
               <label>Tittel
                 <input id="task-title" placeholder="Hva skal gjøres?" autofocus />
               </label>
               <label>Beskrivelse
                 <textarea id="task-desc" placeholder="Detaljer (valgfritt)" rows="3"></textarea>
               </label>
               <label>Frist
                 <input id="task-deadline" type="date" />
               </label>
               <label>Tildel til
                 <select id="task-assignee">
                   <option value="">Ikke tildelt</option>
                   ${state.employees.map((e) => `<option value="${e.id}" ${state.selected === e.id ? "selected" : ""}>${esc(e.name)}</option>`).join("")}
                 </select>
               </label>
               <div class="modal-actions">
                 <button class="ghost" data-action="close-form">Avbryt</button>
                 <button class="btn-primary" data-action="submit-task">Legg ut oppgave</button>
               </div>
             </div>
           </div>`
        : ""
    }

    ${state.saveError ? `<div class="save-error">${esc(state.saveError)}</div>` : ""}
  `;

  const nameInput = document.getElementById("new-employee-name");
  if (nameInput) {
    nameInput.focus();
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addEmployee();
    });
  }
  const titleInput = document.getElementById("task-title");
  if (titleInput) {
    titleInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitTask();
    });
  }
}

// ---- Klikk-håndtering (event delegation) ----
document.addEventListener("click", (e) => {
  if (e.target.classList && e.target.classList.contains("modal-backdrop")) {
    setState({ showForm: false });
    return;
  }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === "select") setState({ selected: id });
  else if (action === "start-add-employee") setState({ addingEmployee: true });
  else if (action === "add-employee") addEmployee();
  else if (action === "ask-remove") setState({ confirmRemoveId: id });
  else if (action === "cancel-remove") setState({ confirmRemoveId: null });
  else if (action === "confirm-remove") removeEmployee(id);
  else if (action === "open-form") setState({ showForm: true });
  else if (action === "close-form") setState({ showForm: false });
  else if (action === "submit-task") submitTask();
  else if (action === "toggle-done") toggleDone(id);
  else if (action === "ask-delete-task") setState({ confirmDeleteTaskId: id });
  else if (action === "cancel-delete-task") setState({ confirmDeleteTaskId: null });
  else if (action === "confirm-delete-task") deleteTask(id);
});

// ---- Start ----
load();
setInterval(load, POLL_INTERVAL_MS);
</script>
</body>
</html>
